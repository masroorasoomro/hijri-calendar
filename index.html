<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hijri + Gregorian Calendar</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7f4;--card:#fff;--tx:#1d2420;--mut:#6b756f;--ac:#0f766e;--acbg:#d7efec;--bd:#e1e5e0;--warn:#b45309}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111614;--card:#1a211e;--tx:#e8eeea;--mut:#92a09a;--ac:#2dd4bf;--acbg:#14403b;--bd:#28312d;--warn:#fbbf24}}
:root[data-theme="dark"]{--bg:#111614;--card:#1a211e;--tx:#e8eeea;--mut:#92a09a;--ac:#2dd4bf;--acbg:#14403b;--bd:#28312d;--warn:#fbbf24}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:480px;margin:0 auto;padding:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:18px;margin:0;text-align:center;flex:1}
.sub{text-align:center;color:var(--mut);font-size:13px;margin:2px 0 10px}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 12px;cursor:pointer}
button:active{background:var(--acbg)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.wd{text-align:center;font-size:11px;color:var(--mut);padding:4px 0}
.c{background:var(--card);border:1px solid var(--bd);border-radius:10px;min-height:54px;padding:4px 2px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
.c.e{visibility:hidden}
.g{font-size:16px;font-weight:600}
.h{font-size:11px;color:var(--mut)}
.c.fri .g{color:var(--ac)}
.c.today{border-color:var(--ac);border-width:2px}
.c.sel{background:var(--acbg)}
.c.h1 .h{color:var(--ac);font-weight:700}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-top:12px}
.big{font-size:17px;font-weight:600}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.row span{font-size:13px;color:var(--mut);min-width:84px}
.row button{flex:1}
.edited{color:var(--warn);font-size:12px}
#msg{min-height:18px;font-size:12px;color:var(--warn);margin-top:6px}
.note{font-size:12px;color:var(--mut);margin-top:10px}
.pt{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 4px;margin-top:10px;text-align:center}.pt b{display:block;font-weight:500;font-size:13px;color:var(--mut)}.pt span{font-size:16px;font-weight:600}.row input{flex:1;min-width:0;font:inherit;padding:8px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}.on{background:var(--acbg)}
</style>
</head>
<body>
<div class="top">
  <button id="prev" aria-label="Previous month">‹</button>
  <h1 id="title"></h1>
  <button id="next" aria-label="Next month">›</button>
</div>
<div class="sub" id="sub"></div>
<div class="grid" id="grid"></div>
<div class="row"><button id="today">Today</button></div>

<div class="card">
  <div class="big" id="selG"></div>
  <div class="big" id="selH" style="color:var(--ac)"></div>
  <div class="note" id="mInfo"></div>
  <div class="row"><span>Month start</span><button id="sm">−1 day</button><button id="sp">+1 day</button></div>
  <div class="row"><span>Month length</span><button id="l29">29 days</button><button id="l30">30 days</button></div>
  <div class="row"><button id="reset">Reset this month</button></div>
  <div id="msg"></div>
</div>
<div class="card"><div class="big">Prayer times <span id="pd" style="font-size:13px;font-weight:400;color:var(--mut)"></span></div><div class="note" id="plc"></div><div class="pt" id="pt"></div><div class="row"><button id="gps">Use my location</button><button id="mc">Enter coordinates</button></div><div class="row" id="crow" style="display:none"><input id="la" placeholder="Latitude e.g. 27.85" inputmode="decimal"><input id="lo" placeholder="Longitude e.g. 67.90" inputmode="decimal"><button id="csv">Save</button></div><div class="row"><span>Asr</span><button id="as">Standard</button><button id="ah">Hanafi</button></div><div class="note" id="pmsg"></div></div>
<div class="note">Base dates use the Umm al-Qura calendar. Adjust only the month you need: other months stay unchanged. Changes are saved on this device.</div>

<script>
const DAY=864e5;
const MN=["Muharram","Safar","Rabi al-Awwal","Rabi al-Thani","Jumada al-Awwal","Jumada al-Thani","Rajab","Shaban","Ramadan","Shawwal","Dhul Qadah","Dhul Hijjah"];
const WD=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const mk=c=>new Intl.DateTimeFormat('en-u-ca-'+c+'-nu-latn',{timeZone:'UTC',year:'numeric',month:'numeric',day:'numeric'});
let F;try{F=mk('islamic-umalqura');F.format(0)}catch(e){F=mk('islamic-civil')}
function bh(n){let y,m,d;for(const p of F.formatToParts(new Date(n*DAY))){if(p.type==='year')y=+p.value;if(p.type==='month')m=+p.value;if(p.type==='day')d=+p.value}return{y,m,d}}
const e0=new Date(0);e0.setUTCFullYear(622,6,19);const N0=Math.floor(e0/DAY);
const bc=new Map();
function baseStart(k){
  if(bc.has(k))return bc.get(k);
  const y=Math.floor(k/12),m=k%12+1;let est=N0+Math.round(k*29.530588);
  for(let i=0;i<40;i++){const h=bh(est);const diff=(h.y*12+h.m)-(y*12+m);
    if(diff===0){est-=h.d-1;break}
    est-=Math.round(diff*29.53)||Math.sign(diff)}
  bc.set(k,est);return est}
let ov={};try{ov=JSON.parse(localStorage.getItem('hijri_ov')||'{}')}catch(e){}
function save(){try{localStorage.setItem('hijri_ov',JSON.stringify(ov))}catch(e){}}
const start=k=>ov[k]!==undefined?ov[k]:baseStart(k);
const len=k=>start(k+1)-start(k);
function hij(n){const b=bh(n),k0=b.y*12+b.m-1;
  for(const k of [k0+1,k0,k0-1]){const s=start(k);if(s<=n)return{k,y:Math.floor(k/12),m:k%12+1,d:n-s+1,s}}
  return{k:k0-1,y:b.y,m:b.m,d:b.d,s:n-b.d+1}}
function setStart(k,v){if(v===baseStart(k))delete ov[k];else ov[k]=v;save()}
const D=(n,o)=>new Date(n*DAY).toLocaleDateString('en-GB',Object.assign({timeZone:'UTC'},o));
const nowL=new Date();const todayN=Math.floor(Date.UTC(nowL.getFullYear(),nowL.getMonth(),nowL.getDate())/DAY);
let sel=todayN,vy=nowL.getFullYear(),vm=nowL.getMonth();
const $=id=>document.getElementById(id);
const say=t=>{$('msg').textContent=t;if(t)setTimeout(()=>{$('msg').textContent=''},3500)};

function render(){
  const first=Math.floor(Date.UTC(vy,vm,1)/DAY),dim=new Date(Date.UTC(vy,vm+1,0)).getUTCDate();
  $('title').textContent=D(first,{month:'long',year:'numeric'});
  const a=hij(first),z=hij(first+dim-1);
  $('sub').textContent=a.k===z.k?`${MN[a.m-1]} ${a.y}`:`${MN[a.m-1]} ${a.y} – ${MN[z.m-1]} ${z.y}`;
  const g=$('grid');g.innerHTML='';
  WD.forEach(w=>{const d=document.createElement('div');d.className='wd';d.textContent=w;g.appendChild(d)});
  const off=(new Date(first*DAY)).getUTCDay();
  for(let i=0;i<off;i++){const d=document.createElement('div');d.className='c e';g.appendChild(d)}
  for(let i=0;i<dim;i++){const n=first+i,h=hij(n),c=document.createElement('div');
    c.className='c'+(h.d===1?' h1':'')+((off+i)%7===5?' fri':'')+(n===todayN?' today':'')+(n===sel?' sel':'');
    c.innerHTML=`<span class="g">${i+1}</span><span class="h">${h.d===1?MN[h.m-1].split(' ')[0].slice(0,5)+' 1':h.d}</span>`;
    c.onclick=()=>{sel=n;render()};g.appendChild(c)}
  const h=hij(sel);
  $('selG').textContent=D(sel,{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  $('selH').textContent=`${h.d} ${MN[h.m-1]} ${h.y} AH`;
  const L=len(h.k),ed=(ov[h.k]!==undefined||ov[h.k+1]!==undefined);
  $('mInfo').innerHTML=`${MN[h.m-1]} ${h.y}: starts ${D(h.s,{weekday:'short',day:'numeric',month:'short'})}, ${L} days${ed?' <span class="edited">(edited)</span>':''}`;
}
function curK(){return hij(sel).k}
function fixFwd(k){for(let j=k;j<k+12;j++){const L=start(j+1)-start(j);if(L<29)setStart(j+1,start(j)+29);else if(L>30)setStart(j+1,start(j)+30);else break}}
function tryStart(k,v){const pl=v-start(k-1);
  if(pl<29||pl>30){say('Not possible: the previous month would become '+pl+' days. Set the previous month length first.');return}
  setStart(k,v);fixFwd(k);say('');render()}
$('sm').onclick=()=>{const k=curK();tryStart(k,start(k)-1)};
$('sp').onclick=()=>{const k=curK();tryStart(k,start(k)+1)};
function setLen(L){const k=curK();setStart(k+1,start(k)+L);fixFwd(k+1);say('');render()}
$('l29').onclick=()=>setLen(29);
$('l30').onclick=()=>setLen(30);
$('reset').onclick=()=>{const k=curK();delete ov[k];delete ov[k+1];save();say('');render()};
$('prev').onclick=()=>{vm--;if(vm<0){vm=11;vy--}render()};
$('next').onclick=()=>{vm++;if(vm>11){vm=0;vy++}render()};
$('today').onclick=()=>{sel=todayN;vy=nowL.getFullYear();vm=nowL.getMonth();render()};
const R=Math.PI/180,sind=x=>Math.sin(x*R),cosd=x=>Math.cos(x*R),tand=x=>Math.tan(x*R),asn=x=>Math.asin(x)/R,acs=x=>Math.acos(x)/R,at2=(y,x)=>Math.atan2(y,x)/R,fx=(a,b)=>{a=a-b*Math.floor(a/b);return a<0?a+b:a};
function jul(Y,M,D){if(M<=2){Y--;M+=12}const A=Math.floor(Y/100),B=2-A+Math.floor(A/4);return Math.floor(365.25*(Y+4716))+Math.floor(30.6001*(M+1))+D+B-1524.5}
function sunPos(j){const d=j-2451545,g=fx(357.529+0.98560028*d,360),q=fx(280.459+0.98564736*d,360),L=fx(q+1.915*sind(g)+0.02*sind(2*g),360),e=23.439-3.6e-7*d,RA=fx(at2(cosd(e)*sind(L),cosd(L))/15,24);return{decl:asn(sind(e)*sind(L)),eq:q/15-RA}}
function pray(Y,M,D,lat,lng,tz,asr){const J=jul(Y,M,D)-lng/360,S=h=>sunPos(J+h/24),mid=h=>fx(12-S(h).eq,24);
 const ang=(a,h,ccw)=>{const s=S(h),v=(-sind(a)-sind(s.decl)*sind(lat))/(cosd(s.decl)*cosd(lat));return mid(h)+(ccw?-1:1)*acs(v)/15};
 const s13=S(13),aa=-Math.atan(1/(asr+tand(Math.abs(lat-s13.decl))))/R,av=(-sind(aa)-sind(s13.decl)*sind(lat))/(cosd(s13.decl)*cosd(lat));
 const adj=(18),k=tz-lng/15;
 const fajr=ang(adj,5,1)+k,sr=ang(0.833,6,1)+k,dh=mid(12)+k,as=mid(13)+acs(av)/15+k,mg=ang(0.833,18)+k,is=ang(adj,18)+k;
 return{Imsak:fajr-10/60,Fajr:fajr,Sunrise:sr,Dhuhr:dh,Asr:as,Maghrib:mg,Isha:is,Midnight:mg+fx(sr-mg,24)/2}}
function ft(h){if(!isFinite(h))return'--';h=fx(h+0.5/60,24);let H=Math.floor(h),m=Math.floor((h-H)*60);const ap=H>=12?'PM':'AM';H=H%12||12;return H+':'+String(m).padStart(2,'0')+' '+ap}
let loc={lat:24.8607,lng:67.0011,asr:2,def:true};try{Object.assign(loc,JSON.parse(localStorage.getItem('hijri_loc')||'{}'))}catch(e){}
const saveLoc=()=>{try{localStorage.setItem('hijri_loc',JSON.stringify(loc))}catch(e){}};
const pm=t=>{$('pmsg').textContent=t};
function prayer(){const dt=new Date(sel*DAY),Y=dt.getUTCFullYear(),M=dt.getUTCMonth()+1,D=dt.getUTCDate(),tz=-new Date(Y,M-1,D,12).getTimezoneOffset()/60;
 const p=pray(Y,M,D,loc.lat,loc.lng,tz,loc.asr);
 $('pd').textContent='· '+dt.toLocaleDateString('en-GB',{timeZone:'UTC',weekday:'short',day:'numeric',month:'short',year:'numeric'});
 $('pt').innerHTML=Object.keys(p).map(k=>`<div><b>${k}</b><span>${ft(p[k])}</span></div>`).join('');
 $('plc').textContent=`${loc.lat.toFixed(4)}, ${loc.lng.toFixed(4)}${loc.def?' (Karachi, default: set your location)':''} · Karachi method (18°)`;
 $('as').classList.toggle('on',loc.asr===1);$('ah').classList.toggle('on',loc.asr===2)}
const _r=render;render=function(){_r();prayer()};
async function getPos(){const P=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.Geolocation;
 if(P){try{await P.requestPermissions();const r=await P.getCurrentPosition({timeout:20000});return r.coords}catch(e){}}
 return new Promise((ok,no)=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>ok(p.coords),no,{timeout:20000}):no(new Error('no geolocation')))}
$('gps').onclick=async()=>{pm('Getting location…');try{const c=await getPos();loc.lat=c.latitude;loc.lng=c.longitude;loc.def=false;saveLoc();pm('Location updated.');render()}catch(e){pm('Could not get location. Allow location permission, or enter coordinates.')}};
$('mc').onclick=()=>{const r=$('crow');r.style.display=r.style.display==='none'?'flex':'none'};
$('csv').onclick=()=>{const a=parseFloat($('la').value),b=parseFloat($('lo').value);if(!(a>=-66&&a<=66&&b>=-180&&b<=180)){pm('Enter valid numbers (latitude -66 to 66, longitude -180 to 180).');return}loc.lat=a;loc.lng=b;loc.def=false;saveLoc();pm('Saved.');$('crow').style.display='none';render()};
$('as').onclick=()=>{loc.asr=1;saveLoc();render()};$('ah').onclick=()=>{loc.asr=2;saveLoc();render()};
render();
</script>
</body>
</html>
