name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: |
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android @capacitor/geolocation
          mkdir www && cp index.html www/
          npx cap init "Hijri Calendar" com.example.hijricalendar --web-dir www
          npx cap add android
          sed -i 's#<application#<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/><uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/><application#' android/app/src/main/AndroidManifest.xml
          npx cap sync android
          cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: hijri-calendar-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
